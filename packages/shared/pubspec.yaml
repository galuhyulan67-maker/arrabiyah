name: arabiyyah_shared
description: Shared models, Material 3 emerald theme, Amiri & Poppins fonts, and Firebase/TTS services.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_core: ^3.6.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
